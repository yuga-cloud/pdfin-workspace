[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart"] }

tokio = {
    version = "1.53.1",
    features = [
        "macros",
        "rt-multi-thread",
        "net",
        "signal",
        "sync",
    ],
}

tower = { version = "0.5.2", features = ["limit"] }

tower-http = {
    version = "0.7.0",
    features = [
        "cors",
        "csrf",
        "fs",
        "trace",
        "timeout",
        "limit",
    ],
}

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

shared = { path = "../shared" }

tempfile = { workspace = true }

lopdf = {
    version = "0.45.0",
    features = ["embed_image"],
}
rust_xlsxwriter = "0.99.0"

pdfium-render = "0.9.4"
pdfium-bundled = "0.1.1"

docx-rs = "0.4.22"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }