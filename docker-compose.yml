version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=3000
      - CORS_ORIGIN=http://frontend
      - RUST_LOG=info
      - MAX_REQUEST_BODY_MB=50
      - REQUEST_TIMEOUT_SECS=120
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - pdfin
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend-react/Dockerfile
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - pdfin
    restart: unless-stopped

networks:
  pdfin:
    driver: bridge

volumes:
  # Add volumes for data persistence if needed
