name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect system dependency changes
    runs-on: ubuntu-latest
    outputs:
      system-deps: ${{ steps.filter.outputs.system-deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base_sha="$BASE_SHA"
              head_sha="$HEAD_SHA"
              ;;
            push)
              base_sha="$BEFORE_SHA"
              head_sha="$SHA"
              ;;
            *)
              base_sha=""
              head_sha="$SHA"
              ;;
          esac

          if [[ -n "$base_sha" ]] && git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$head_sha")"
          fi

          if grep -Eq '^(backend/src/engines/office/|backend/src/engines/optimize/|backend/src/engines/rendering/|backend/Cargo.toml|Cargo.toml|Cargo.lock)' <<<"$changed_files"; then
            echo "system-deps=true" >> "$GITHUB_OUTPUT"
          else
            echo "system-deps=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust check, lint and test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install lightweight build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cargo check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked -- --skip tesseract_should_be_available

  system-integration:
    name: System dependency integration tests
    needs: changes
    if: needs.changes.outputs.system-deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libssl-dev \
            tesseract-ocr \
            libreoffice \
            python3-uno \
            poppler-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: System tool smoke checks
        run: |
          tesseract --version
          libreoffice --version
          pdftoppm -v

      - name: Tests
        run: cargo test --workspace --all-targets --all-features --locked

  frontend:
    name: Frontend typecheck, lint, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high
