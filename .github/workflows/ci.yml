name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Existing self-hosted runner pipeline retained.
# Public repository readiness improvements are handled by the
# existing security workflows and this CI workflow.
