name: CI

# Legacy umbrella workflow kept as a manual entrypoint.
# Validation is split into focused workflows:
# - backend-ci.yml
# - frontend-ci.yml
# - system-integration.yml
# - security workflows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  info:
    name: Pipeline split notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "CI is split into focused workflows."
          echo "Run backend, frontend, integration, or security workflows directly."
