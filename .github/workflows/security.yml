name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: Cargo audit (private stage)
    if: github.event.repository.visibility != 'public'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cargo >/dev/null
          command -v rustc >/dev/null
          cargo --version
          rustc --version

      - name: Verify committed dependency lockfile
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Install cargo-audit
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-audit

      - name: Audit dependencies
        run: cargo audit

  npm-audit:
    name: npm audit (private stage)
    if: github.event.repository.visibility != 'public'
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Verify committed npm lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high
