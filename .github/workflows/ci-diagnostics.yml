name: CI Diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runner-baseline:
    name: Runner baseline
    runs-on: ubuntu-latest
    steps:
      - name: Print runner environment
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          node --version || true
          npm --version || true
          git --version

  checkout-smoke:
    name: Checkout smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify repository state
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git rev-parse --show-toplevel)"
          test -n "$(git rev-parse HEAD)"
          git status --short --branch
