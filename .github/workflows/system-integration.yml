name: System Integration

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/system-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/system-integration.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: system-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: PDF engine system integration tests
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@11d596a0326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify system dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v tesseract
          command -v libreoffice
          command -v pdftoppm
          tesseract --version
          libreoffice --version
          pdftoppm -v

      - name: Verify Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v cargo
          command -v rustc
          cargo --version
          rustc --version

      - name: Verify locked dependency graph
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run integration tests
        run: cargo test --workspace --all-targets --all-features --locked
