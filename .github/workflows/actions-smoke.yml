name: Actions Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Hosted runner smoke test
    runs-on: ubuntu-slim
    steps:
      - name: Print environment
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=${RUNNER_NAME}"
          echo "os=${RUNNER_OS}"
          echo "arch=${RUNNER_ARCH}"
          echo "github_sha=${GITHUB_SHA}"
          git --version
          node --version
          npm --version
