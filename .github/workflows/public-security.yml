name: Public Security Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "53 3 * * 1"

permissions:
  contents: read

concurrency:
  group: public-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NPM_CONFIG_AUDIT: "true"

jobs:
  audit:
    name: Public dependency security audit
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
          rustc --version

      - name: Verify locked Rust dependency graph
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Install cargo-audit
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Require committed npm lockfile
        working-directory: frontend-react
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend-react
        run: npm ci --ignore-scripts

      - name: Audit npm dependencies
        working-directory: frontend-react
        run: npm audit --audit-level=high
