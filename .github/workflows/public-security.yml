name: Public Security Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "53 3 * * 1"

permissions:
  contents: read

concurrency:
  group: public-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (GitHub-hosted)
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
          rustc --version

      - name: Verify committed Cargo.lock
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Install cargo-audit
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Require committed npm lockfile
        working-directory: frontend-react
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json || {
            echo "::error::frontend-react/package-lock.json is required for public security auditing."
            exit 1
          }

      - name: Install frontend dependencies without lifecycle scripts
        working-directory: frontend-react
        run: npm ci --ignore-scripts

      - name: npm audit
        working-directory: frontend-react
        run: npm audit --audit-level=high


  secret-scan:
    name: Full-history secret scan (GitHub-hosted)
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors "$url" -o "$archive"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan every Git ref
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts="--all"
