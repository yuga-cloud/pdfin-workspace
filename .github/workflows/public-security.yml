name: Public Security Audit

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "backend/**"
      - "shared/**"
      - "frontend-react/**"
      - ".github/workflows/public-security.yml"
  schedule:
    - cron: "53 3 * * 1"

permissions:
  contents: read

concurrency:
  group: public-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit (GitHub-hosted)
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install stable Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version
          rustc --version

      - name: Verify committed Cargo.lock
        run: cargo metadata --locked --format-version=1 >/dev/null

      - name: Install cargo-audit
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-audit

      - name: Cargo audit
        run: cargo audit

      - name: Require committed npm lockfile
        working-directory: frontend-react
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json || {
            echo "::error::frontend-react/package-lock.json is required for public security auditing."
            exit 1
          }

      - name: Install frontend dependencies without lifecycle scripts
        working-directory: frontend-react
        run: npm ci --ignore-scripts

      - name: npm audit
        working-directory: frontend-react
        run: npm audit --audit-level=high
