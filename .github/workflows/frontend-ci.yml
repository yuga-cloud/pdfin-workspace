name: Frontend CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend-react/**'
  push:
    branches: [main]
    paths:
      - 'frontend-react/**'

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: false
  NPM_CONFIG_AUDIT: false

jobs:
  frontend:
    name: React validation
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check Node toolchain
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version

      - name: Require lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -f package-lock.json

      - name: Cache npm
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend-react/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
